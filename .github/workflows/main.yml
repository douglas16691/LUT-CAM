          class MainActivity : ComponentActivity() {
              private val INK = 0xFF14110F.toInt(); private val PANEL = 0xFF1E1A17.toInt()
              private val BONE = 0xFFECE6DA.toInt(); private val AMBER = 0xFFF0A640.toInt()
              private val EDGE = 0xFF3A342E.toInt()

              private lateinit var gl: GLSurfaceView
              private lateinit var renderer: LutRenderer
              private lateinit var strip: LinearLayout
              private lateinit var lookLabel: TextView
              private var surfaceTex: SurfaceTexture? = null
       
